# Frontend Configuration - Professional Light Theme

[theme]
# Base theme - "light" or "dark"
base = "light"

# Primary accent color for interactive elements (Blue 600)
primaryColor = "#2563eb"

# Background color for the main content area
backgroundColor = "#ffffff"

# Background color for secondary areas (Gray 50)
secondaryBackgroundColor = "#f9fafb"

# Color used for almost all text (Gray 900)
textColor = "#111827"

# Font family for all text in the app
font = "Inter, sans-serif"

[server]
# Next.js server settings
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
# Internet address
serverAddress = "localhost"

# Default port
serverPort = 3000

# Usage stats
gatherUsageStats = false
